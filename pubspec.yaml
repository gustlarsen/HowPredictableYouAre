name: howpredictable
description: "How Predictable You Are - Rock Paper Scissors vs Markov Chain AI"
publish_to: 'none'
version: 1.0.8+108

environment:
  sdk: ^3.5.0

dependencies:
  flutter:
    sdk: flutter
  shared_preferences: ^2.3.2
  audioplayers: ^6.1.0

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^5.0.0

flutter:
  uses-material-design: true
  assets:
    - assets/
    - assets/attack.mid
    - assets/Battle.mid
    - assets/defeat.mid
    - assets/draw.mid
    - assets/attack.wav
    - assets/Battle.wav
    - assets/defeat.wav
    - assets/draw.wav
    - assets/BGBlue.jpg
    - assets/BGDraw.jpg
    - assets/BGRed.jpg
    - assets/icon.png
    - assets/PaperL.png
    - assets/PaperR.png
    - assets/RockL.png
    - assets/RockR.png
    - assets/ScissorL.png
    - assets/ScissorR.png
    - assets/Splash.png
    - assets/stringsHowPredict.json
