name: Feature Request
description: Suggest an idea or feature for How Predictable You Are
title: "[FEATURE] "
labels: ["enhancement"]
body:
  - type: markdown
    attributes:
      value: Thanks for suggesting an enhancement to How Predictable You Are!
  - type: textarea
    id: problem
    attributes:
      label: Is your feature request related to a problem?
      description: A clear and concise description of what the problem is.
    validations:
      required: false
  - type: textarea
    id: solution
    attributes:
      label: Describe the solution you'd like
      description: A clear and concise description of what you want to happen.
    validations:
      required: true
  - type: textarea
    id: context
    attributes:
      label: Additional context or alternatives
      description: Add any other context, screenshots, or mockups.
    validations:
      required: false
