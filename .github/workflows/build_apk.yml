name: Build & Release Android APK

on:
  push:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    name: Build & Release Flutter APK
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Set up Java 17
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'
          cache: 'gradle'

      - name: Set up Flutter (stable)
        uses: subosito/flutter-action@v2
        with:
          channel: 'stable'
          cache: true

      - name: Prepare Log Directory
        run: mkdir -p build_logs

      - name: Calculate Incremental Version
        id: version_info
        run: |
          echo "versioning" > build_logs/phase.txt
          git fetch --tags --force
          LATEST_TAG=$(git describe --tags $(git rev-list --tags --max-count=1) 2>/dev/null || echo "")
          if [ -z "$LATEST_TAG" ]; then
            LATEST_TAG="v1.0.0"
            NEW_TAG="v1.0.1"
            VERSION_NAME="1.0.1"
            VERSION_CODE=101
          else
            VERSION="${LATEST_TAG#v}"
            MAJOR=$(echo "$VERSION" | cut -d. -f1)
            MINOR=$(echo "$VERSION" | cut -d. -f2)
            PATCH=$(echo "$VERSION" | cut -d. -f3)
            if [ -z "$MAJOR" ]; then MAJOR=1; fi
            if [ -z "$MINOR" ]; then MINOR=0; fi
            if [ -z "$PATCH" ]; then PATCH=0; fi
            NEW_PATCH=$((PATCH + 1))
            if [ "$MAJOR" -eq 1 ] && [ "$MINOR" -eq 0 ] && [ "$PATCH" -lt 3 ]; then
              NEW_PATCH=4
            fi
            NEW_TAG="v${MAJOR}.${MINOR}.${NEW_PATCH}"
            VERSION_NAME="${MAJOR}.${MINOR}.${NEW_PATCH}"
            VERSION_CODE=$(( MAJOR * 100 + MINOR * 10 + NEW_PATCH ))
          fi
          APK_ARM64="how-predur-v${VERSION_CODE}-arm64-v8a.apk"
          APK_ARM32="how-predur-v${VERSION_CODE}-armeabi-v7a.apk"
          APK_X86="how-predur-v${VERSION_CODE}-x86_64.apk"
          AAB_NAME="how-predur-v${VERSION_CODE}.aab"
          echo "Previous tag: $LATEST_TAG"
          echo "New tag: $NEW_TAG"
          echo "Version name: $VERSION_NAME"
          echo "Version code: $VERSION_CODE"
          echo "APK ARM64 name: $APK_ARM64"
          echo "AAB name: $AAB_NAME"
          echo "tag=$NEW_TAG" >> $GITHUB_OUTPUT
          echo "version_name=$VERSION_NAME" >> $GITHUB_OUTPUT
          echo "version_code=$VERSION_CODE" >> $GITHUB_OUTPUT
          echo "apk_arm64=$APK_ARM64" >> $GITHUB_OUTPUT
          echo "apk_arm32=$APK_ARM32" >> $GITHUB_OUTPUT
          echo "apk_x86=$APK_X86" >> $GITHUB_OUTPUT
          echo "apk_name=$APK_ARM64" >> $GITHUB_OUTPUT
          echo "aab_name=$AAB_NAME" >> $GITHUB_OUTPUT
          rm -f build_logs/phase.txt

      - name: Install dependencies
        working-directory: VSCode
        run: |
          echo "dependencies" > ../build_logs/phase.txt
          flutter pub get 2>&1 | tee ../build_logs/pub_get.log
          rm -f ../build_logs/phase.txt

      - name: Run automated tests
        working-directory: VSCode
        run: |
          echo "test" > ../build_logs/phase.txt
          flutter test 2>&1 | tee ../build_logs/test.log
          rm -f ../build_logs/phase.txt

      - name: Decode Release Keystore
        working-directory: VSCode
        env:
          SIGNING_KEY: ${{ secrets.SIGNING_KEY }}
        run: |
          if [ -n "$SIGNING_KEY" ]; then
            echo "$SIGNING_KEY" | base64 --decode > android/app/upload-keystore.jks
          else
            echo "::warning::SIGNING_KEY secret is not set; falling back to debug signing."
          fi

      - name: Build Android APK & App Bundle (Release)
        working-directory: VSCode
        env:
          KEYSTORE_PATH: upload-keystore.jks
          KEYSTORE_PASSWORD: ${{ secrets.KEYSTORE_PASSWORD }}
          KEY_ALIAS: ${{ secrets.KEY_ALIAS }}
          KEY_PASSWORD: ${{ secrets.KEY_PASSWORD }}
          VERSION_CODE: ${{ steps.version_info.outputs.version_code }}
          VERSION_NAME: ${{ steps.version_info.outputs.version_name }}
        run: |
          echo "build" > ../build_logs/phase.txt
          flutter build apk --release \
            --split-per-abi \
            --split-debug-info=build/symbols \
            --obfuscate \
            --build-name=${{ steps.version_info.outputs.version_name }} \
            --build-number=${{ steps.version_info.outputs.version_code }} 2>&1 | tee ../build_logs/build.log

          mv build/app/outputs/flutter-apk/app-arm64-v8a-release.apk build/app/outputs/flutter-apk/${{ steps.version_info.outputs.apk_arm64 }}
          mv build/app/outputs/flutter-apk/app-armeabi-v7a-release.apk build/app/outputs/flutter-apk/${{ steps.version_info.outputs.apk_arm32 }}
          mv build/app/outputs/flutter-apk/app-x86_64-release.apk build/app/outputs/flutter-apk/${{ steps.version_info.outputs.apk_x86 }}

          flutter build appbundle --release \
            --split-debug-info=build/symbols \
            --obfuscate \
            --build-name=${{ steps.version_info.outputs.version_name }} \
            --build-number=${{ steps.version_info.outputs.version_code }} 2>&1 | tee -a ../build_logs/build.log

          mv build/app/outputs/bundle/release/app-release.aab build/app/outputs/bundle/release/${{ steps.version_info.outputs.aab_name }}

          rm -f ../build_logs/phase.txt

      - name: Clean Up Release Keystore
        if: always()
        working-directory: VSCode
        run: rm -f android/app/upload-keystore.jks

      - name: Upload Build Artifacts (APK & AAB)
        uses: actions/upload-artifact@v4
        with:
          name: how-predur-v${{ steps.version_info.outputs.version_code }}-apks
          path: |
            VSCode/build/app/outputs/flutter-apk/*.apk
            VSCode/build/app/outputs/bundle/release/*.aab
          if-no-files-found: error
          retention-days: 14

      - name: Push Incremental Tag
        run: |
          echo "tag_release" > build_logs/phase.txt
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git tag "${{ steps.version_info.outputs.tag }}"
          git push origin "${{ steps.version_info.outputs.tag }}"
          rm -f build_logs/phase.txt

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ steps.version_info.outputs.tag }}
          name: Release ${{ steps.version_info.outputs.tag }}
          files: |
            VSCode/build/app/outputs/flutter-apk/*.apk
            VSCode/build/app/outputs/bundle/release/*.aab
          generate_release_notes: true
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Send APK to Telegram Channel
        if: success()
        env:
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
        run: |
          python3 .github/scripts/telegram_notify.py success \
            --apk "VSCode/build/app/outputs/flutter-apk/${{ steps.version_info.outputs.apk_arm64 }}" \
            --version-name "${{ steps.version_info.outputs.version_name }}" \
            --version-code "${{ steps.version_info.outputs.version_code }}" \
            --tag "${{ steps.version_info.outputs.tag }}" \
            --commit "${{ github.sha }}" \
            --repo "${{ github.repository }}" \
            --server-url "${{ github.server_url }}" \
            --run-id "${{ github.run_id }}"

      - name: Send Failure Notification to Telegram
        if: failure()
        env:
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
        run: |
          python3 .github/scripts/telegram_notify.py failure \
            --commit "${{ github.sha }}" \
            --repo "${{ github.repository }}" \
            --server-url "${{ github.server_url }}" \
            --run-id "${{ github.run_id }}" \
            --actor "${{ github.actor }}"
