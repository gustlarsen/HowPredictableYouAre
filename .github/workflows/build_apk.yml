name: Build & Release Android APK

on:
  push:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    name: Build & Release Flutter APK
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up Java 17
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'
          cache: 'gradle'

      - name: Set up Flutter (stable)
        uses: subosito/flutter-action@v2
        with:
          channel: 'stable'
          cache: true

      - name: Calculate Incremental Version
        id: version_info
        run: |
          git fetch --tags --force
          LATEST_TAG=$(git describe --tags $(git rev-list --tags --max-count=1) 2>/dev/null || echo "")
          if [ -z "$LATEST_TAG" ]; then
            LATEST_TAG="v1.0.0"
            NEW_TAG="v1.0.1"
            VERSION_NAME="1.0.1"
            VERSION_CODE=101
          else
            VERSION="${LATEST_TAG#v}"
            MAJOR=$(echo "$VERSION" | cut -d. -f1)
            MINOR=$(echo "$VERSION" | cut -d. -f2)
            PATCH=$(echo "$VERSION" | cut -d. -f3)
            if [ -z "$MAJOR" ]; then MAJOR=1; fi
            if [ -z "$MINOR" ]; then MINOR=0; fi
            if [ -z "$PATCH" ]; then PATCH=0; fi
            NEW_PATCH=$((PATCH + 1))
            if [ "$MAJOR" -eq 1 ] && [ "$MINOR" -eq 0 ] && [ "$PATCH" -lt 3 ]; then
              NEW_PATCH=4
            fi
            NEW_TAG="v${MAJOR}.${MINOR}.${NEW_PATCH}"
            VERSION_NAME="${MAJOR}.${MINOR}.${NEW_PATCH}"
            VERSION_CODE=$(( MAJOR * 100 + MINOR * 10 + NEW_PATCH ))
          fi
          APK_NAME="how-predur-v${VERSION_CODE}.apk"
          echo "Previous tag: $LATEST_TAG"
          echo "New tag: $NEW_TAG"
          echo "Version name: $VERSION_NAME"
          echo "Version code: $VERSION_CODE"
          echo "APK name: $APK_NAME"
          echo "tag=$NEW_TAG" >> $GITHUB_OUTPUT
          echo "version_name=$VERSION_NAME" >> $GITHUB_OUTPUT
          echo "version_code=$VERSION_CODE" >> $GITHUB_OUTPUT
          echo "apk_name=$APK_NAME" >> $GITHUB_OUTPUT

      - name: Install dependencies
        working-directory: VSCode
        run: flutter pub get

      - name: Run automated tests
        working-directory: VSCode
        run: flutter test

      - name: Build Android APK
        working-directory: VSCode
        run: |
          flutter build apk --release --build-name=${{ steps.version_info.outputs.version_name }} --build-number=${{ steps.version_info.outputs.version_code }}
          mv build/app/outputs/flutter-apk/app-release.apk build/app/outputs/flutter-apk/${{ steps.version_info.outputs.apk_name }}

      - name: Upload APK Artifact
        uses: actions/upload-artifact@v4
        with:
          name: ${{ steps.version_info.outputs.apk_name }}
          path: VSCode/build/app/outputs/flutter-apk/${{ steps.version_info.outputs.apk_name }}
          if-no-files-found: error
          retention-days: 14

      - name: Push Incremental Tag
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git tag "${{ steps.version_info.outputs.tag }}"
          git push origin "${{ steps.version_info.outputs.tag }}"

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ steps.version_info.outputs.tag }}
          name: Release ${{ steps.version_info.outputs.tag }}
          files: VSCode/build/app/outputs/flutter-apk/${{ steps.version_info.outputs.apk_name }}
          generate_release_notes: true
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
