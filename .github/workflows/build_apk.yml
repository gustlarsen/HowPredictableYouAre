name: Build & Release Android APK

on:
  push:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build_and_notify:
    name: Build & Release Flutter APK
    runs-on: ubuntu-latest
    outputs:
      version_name: ${{ steps.version_info.outputs.version_name }}
      version_code: ${{ steps.version_info.outputs.version_code }}
      aab_name: ${{ steps.version_info.outputs.aab_name }}
      has_play_credentials: ${{ steps.version_info.outputs.has_play_credentials }}

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Notify Telegram - Build Started
        env:
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
          GITHUB_REF_NAME: ${{ github.ref_name }}
        run: |
          python3 - <<'EOF'
          import json
          import os
          import subprocess
          import sys
          import urllib.error
          import urllib.request

          token = os.environ.get("TELEGRAM_BOT_TOKEN", "").strip()
          chat_id = os.environ.get("TELEGRAM_CHAT_ID", "").strip()
          if not token or not chat_id:
              print("TELEGRAM_BOT_TOKEN or TELEGRAM_CHAT_ID is not configured. Skipping build-started Telegram notification.")
              sys.exit(0)

          branch = os.environ.get("GITHUB_REF_NAME", "").strip() or "main"

          try:
              short_commit = subprocess.check_output(
                  ["git", "rev-parse", "--short", "HEAD"],
                  text=True,
                  encoding="utf-8",
                  errors="replace",
              ).strip()
          except Exception:
              short_commit = "unknown"

          meta_path = os.path.join(".github", "last_push_meta.json")
          meta_modified = False
          try:
              changed_files = subprocess.check_output(
                  ["git", "diff-tree", "--no-commit-id", "--name-only", "-r", "HEAD"],
                  text=True,
                  encoding="utf-8",
                  errors="replace",
              ).splitlines()
              meta_modified = ".github/last_push_meta.json" in [f.strip() for f in changed_files]
          except Exception as exc:
              print(f"Warning: could not inspect changed files in HEAD: {exc}", file=sys.stderr)

          summary = ""
          quota = ""
          if meta_modified and os.path.isfile(meta_path):
              try:
                  with open(meta_path, "r", encoding="utf-8") as f:
                      meta = json.load(f)
                  summary = str(meta.get("summary", "")).strip()
                  quota = str(meta.get("quota", "")).strip()
              except Exception as exc:
                  print(f"Warning: failed to read {meta_path}: {exc}", file=sys.stderr)

          if not summary:
              try:
                  summary = subprocess.check_output(
                      ["git", "log", "-1", "--pretty=%B"],
                      text=True,
                      encoding="utf-8",
                      errors="replace",
                  ).strip()
              except Exception:
                  summary = "No commit summary available."

          if not meta_modified or not quota:
              quota = "Quota status not attached to this commit"

          message = (
              f"📤 Push Received — GitHub Actions Started!\n\n"
              f"🌿 Branch: {branch}\n"
              f"🔗 Commit: {short_commit}\n\n"
              f"📝 Summary of Changes:\n"
              f"{summary}\n\n"
              f"📊 Antigravity Quota Status:\n"
              f"{quota}\n\n"
              f"⏳ Building APK & AAB now... You will be notified once the GitHub Release and Google Play upload finish."
          )

          if len(message) >= 4000:
              message = message[:3980] + "\n... (truncated)"

          url = f"https://api.telegram.org/bot{token}/sendMessage"
          payload = json.dumps({
              "chat_id": chat_id,
              "text": message,
              "disable_web_page_preview": True,
          }).encode("utf-8")

          req = urllib.request.Request(
              url,
              data=payload,
              headers={"Content-Type": "application/json"},
              method="POST",
          )
          try:
              with urllib.request.urlopen(req, timeout=30) as resp:
                  body = resp.read().decode("utf-8", errors="replace")
                  print("Telegram build-started response:", body)
          except urllib.error.HTTPError as exc:
              err_body = exc.read().decode("utf-8", errors="replace")
              print(f"HTTPError sending build-started Telegram notification: {exc.code} - {err_body}", file=sys.stderr)
          except Exception as exc:
              print(f"Error sending build-started Telegram notification: {exc}", file=sys.stderr)
          EOF

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Set up Java 17
        uses: actions/setup-java@v5
        with:
          distribution: 'temurin'
          java-version: '17'
          cache: 'gradle'

      - name: Set up Flutter (stable)
        uses: subosito/flutter-action@v2
        with:
          channel: 'stable'
          flutter-version: '3.47.9'
          cache: true

      - name: Prepare Android SDK directory
        run: |
          sudo mkdir -p /usr/local/lib/android/sdk/ndk
          sudo chown -R $USER:$USER /usr/local/lib/android/sdk

      - name: Resolve Android NDK Version
        id: ndk_info
        run: |
          NDK_VER=$(grep 'val ndkVersion: String =' "$FLUTTER_ROOT/packages/flutter_tools/gradle/src/main/kotlin/FlutterExtension.kt" 2>/dev/null | sed -E 's/.*"([^"]+)".*/\1/' || echo "")
          if [ -z "$NDK_VER" ]; then
            NDK_VER="28.2.13676358"
          fi
          echo "ndk_version=$NDK_VER" >> $GITHUB_OUTPUT
          echo "ANDROID_NDK_VERSION=$NDK_VER" >> $GITHUB_ENV
          echo "ANDROID_NDK_HOME=/usr/local/lib/android/sdk/ndk/$NDK_VER" >> $GITHUB_ENV
          echo "ANDROID_NDK_ROOT=/usr/local/lib/android/sdk/ndk/$NDK_VER" >> $GITHUB_ENV
          echo "ANDROID_NDK=/usr/local/lib/android/sdk/ndk/$NDK_VER" >> $GITHUB_ENV
          echo "Resolved Android NDK version: $NDK_VER"

      - name: Cache Android NDK
        id: cache-ndk
        uses: actions/cache@v4
        with:
          path: /usr/local/lib/android/sdk/ndk/${{ steps.ndk_info.outputs.ndk_version }}
          key: ${{ runner.os }}-android-ndk-${{ steps.ndk_info.outputs.ndk_version }}

      - name: Install Android NDK
        if: steps.cache-ndk.outputs.cache-hit != 'true'
        run: |
          NDK_VER="${{ steps.ndk_info.outputs.ndk_version }}"
          SDK_DIR="/usr/local/lib/android/sdk"
          SDKMANAGER="$SDK_DIR/cmdline-tools/latest/bin/sdkmanager"
          NDK_TARGET_DIR="$SDK_DIR/ndk/$NDK_VER"

          echo "Installing Android NDK $NDK_VER..."
          for i in 1 2 3; do
            echo "Attempt $i: Installing NDK $NDK_VER via sdkmanager..."
            if yes | "$SDKMANAGER" --install "ndk;$NDK_VER" && [ -f "$NDK_TARGET_DIR/source.properties" ]; then
              echo "Android NDK $NDK_VER installed and verified successfully."
              break
            fi
            echo "Attempt $i failed or incomplete. Cleaning up partial download..."
            rm -rf "$NDK_TARGET_DIR"
            rm -rf ~/.android/cache/* 2>/dev/null || true
            if [ "$i" -eq 3 ]; then
              echo "Failed to install Android NDK $NDK_VER after 3 attempts."
              exit 1
            fi
            sleep 5
          done

      - name: Prepare Log Directory
        run: mkdir -p build_logs

      - name: Calculate Incremental Version
        id: version_info
        env:
          GOOGLE_PLAY_SERVICE_ACCOUNT_JSON: ${{ secrets.GOOGLE_PLAY_SERVICE_ACCOUNT_JSON }}
        run: |
          echo "versioning" > build_logs/phase.txt
          if [ -n "$GOOGLE_PLAY_SERVICE_ACCOUNT_JSON" ]; then
            echo "has_play_credentials=true" >> $GITHUB_OUTPUT
          else
            echo "has_play_credentials=false" >> $GITHUB_OUTPUT
          fi
          git fetch --tags --force
          LATEST_TAG=$(git describe --tags $(git rev-list --tags --max-count=1) 2>/dev/null || echo "")
          if [ -z "$LATEST_TAG" ]; then
            LATEST_TAG="v1.0.0"
            NEW_TAG="v1.0.1"
            VERSION_NAME="1.0.1"
            VERSION_CODE=101
          else
            VERSION="${LATEST_TAG#v}"
            MAJOR=$(echo "$VERSION" | cut -d. -f1)
            MINOR=$(echo "$VERSION" | cut -d. -f2)
            PATCH=$(echo "$VERSION" | cut -d. -f3)
            if [ -z "$MAJOR" ]; then MAJOR=1; fi
            if [ -z "$MINOR" ]; then MINOR=0; fi
            if [ -z "$PATCH" ]; then PATCH=0; fi
            NEW_PATCH=$((PATCH + 1))
            if [ "$MAJOR" -eq 1 ] && [ "$MINOR" -eq 0 ] && [ "$PATCH" -lt 3 ]; then
              NEW_PATCH=4
            fi
            NEW_TAG="v${MAJOR}.${MINOR}.${NEW_PATCH}"
            VERSION_NAME="${MAJOR}.${MINOR}.${NEW_PATCH}"
            VERSION_CODE=$(( MAJOR * 100 + MINOR * 10 + NEW_PATCH ))
          fi
          APK_ARM64="how-predur-v${VERSION_CODE}-arm64-v8a.apk"
          APK_ARM32="how-predur-v${VERSION_CODE}-armeabi-v7a.apk"
          APK_X86="how-predur-v${VERSION_CODE}-x86_64.apk"
          AAB_NAME="how-predur-v${VERSION_CODE}.aab"
          echo "Previous tag: $LATEST_TAG"
          echo "New tag: $NEW_TAG"
          echo "Version name: $VERSION_NAME"
          echo "Version code: $VERSION_CODE"
          echo "APK ARM64 name: $APK_ARM64"
          echo "AAB name: $AAB_NAME"
          echo "tag=$NEW_TAG" >> $GITHUB_OUTPUT
          echo "version_name=$VERSION_NAME" >> $GITHUB_OUTPUT
          echo "version_code=$VERSION_CODE" >> $GITHUB_OUTPUT
          echo "apk_arm64=$APK_ARM64" >> $GITHUB_OUTPUT
          echo "apk_arm32=$APK_ARM32" >> $GITHUB_OUTPUT
          echo "apk_x86=$APK_X86" >> $GITHUB_OUTPUT
          echo "apk_name=$APK_ARM64" >> $GITHUB_OUTPUT
          echo "aab_name=$AAB_NAME" >> $GITHUB_OUTPUT
          rm -f build_logs/phase.txt

      - name: Install dependencies
        working-directory: VSCode
        run: |
          set -o pipefail
          echo "dependencies" > ../build_logs/phase.txt
          flutter pub get 2>&1 | tee ../build_logs/pub_get.log
          rm -f ../build_logs/phase.txt

      - name: Run automated tests
        working-directory: VSCode
        run: |
          set -o pipefail
          echo "test" > ../build_logs/phase.txt
          flutter test 2>&1 | tee ../build_logs/test.log
          rm -f ../build_logs/phase.txt

      - name: Decode Release Keystore
        working-directory: VSCode
        env:
          SIGNING_KEY: ${{ secrets.SIGNING_KEY }}
        run: |
          if [ -n "$SIGNING_KEY" ]; then
            echo "$SIGNING_KEY" | base64 --decode > android/app/upload-keystore.jks
          else
            echo "::warning::SIGNING_KEY secret is not set; falling back to debug signing."
          fi

      - name: Build Android APK & App Bundle (Release)
        working-directory: VSCode
        env:
          KEYSTORE_PATH: upload-keystore.jks
          KEYSTORE_PASSWORD: ${{ secrets.KEYSTORE_PASSWORD }}
          KEY_ALIAS: ${{ secrets.KEY_ALIAS }}
          KEY_PASSWORD: ${{ secrets.KEY_PASSWORD }}
          VERSION_CODE: ${{ steps.version_info.outputs.version_code }}
          VERSION_NAME: ${{ steps.version_info.outputs.version_name }}
        run: |
          set -o pipefail
          echo "build" > ../build_logs/phase.txt
          flutter build apk --release \
            --split-per-abi \
            --split-debug-info=build/symbols \
            --obfuscate \
            --build-name=${{ steps.version_info.outputs.version_name }} \
            --build-number=${{ steps.version_info.outputs.version_code }} 2>&1 | tee ../build_logs/build.log

          mv build/app/outputs/flutter-apk/app-arm64-v8a-release.apk build/app/outputs/flutter-apk/${{ steps.version_info.outputs.apk_arm64 }}
          mv build/app/outputs/flutter-apk/app-armeabi-v7a-release.apk build/app/outputs/flutter-apk/${{ steps.version_info.outputs.apk_arm32 }}
          mv build/app/outputs/flutter-apk/app-x86_64-release.apk build/app/outputs/flutter-apk/${{ steps.version_info.outputs.apk_x86 }}

          flutter build appbundle --release \
            --split-debug-info=build/symbols \
            --obfuscate \
            --build-name=${{ steps.version_info.outputs.version_name }} \
            --build-number=${{ steps.version_info.outputs.version_code }} 2>&1 | tee -a ../build_logs/build.log

          mv build/app/outputs/bundle/release/app-release.aab build/app/outputs/bundle/release/${{ steps.version_info.outputs.aab_name }}

          rm -f ../build_logs/phase.txt

      - name: Clean Up Release Keystore
        if: always()
        working-directory: VSCode
        run: rm -f android/app/upload-keystore.jks

      - name: Upload Build Artifacts (APK & AAB)
        uses: actions/upload-artifact@v4
        with:
          name: how-predur-v${{ steps.version_info.outputs.version_code }}-apks
          path: |
            VSCode/build/app/outputs/flutter-apk/*.apk
            VSCode/build/app/outputs/bundle/release/*.aab
          if-no-files-found: error
          retention-days: 14

      - name: Push Incremental Tag
        run: |
          echo "tag_release" > build_logs/phase.txt
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git tag "${{ steps.version_info.outputs.tag }}"
          git push origin "${{ steps.version_info.outputs.tag }}"
          rm -f build_logs/phase.txt

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ steps.version_info.outputs.tag }}
          name: Release ${{ steps.version_info.outputs.tag }}
          files: |
            VSCode/build/app/outputs/flutter-apk/*.apk
            VSCode/build/app/outputs/bundle/release/*.aab
          generate_release_notes: true
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Send APK to Telegram Channel
        if: success()
        env:
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
        run: |
          python3 .github/scripts/telegram_notify.py success \
            --apk "VSCode/build/app/outputs/flutter-apk/${{ steps.version_info.outputs.apk_arm64 }}" \
            --version-name "${{ steps.version_info.outputs.version_name }}" \
            --version-code "${{ steps.version_info.outputs.version_code }}" \
            --tag "${{ steps.version_info.outputs.tag }}" \
            --commit "${{ github.sha }}" \
            --repo "${{ github.repository }}" \
            --server-url "${{ github.server_url }}" \
            --run-id "${{ github.run_id }}"

      - name: Send Failure Notification to Telegram
        if: failure()
        env:
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
        run: |
          python3 .github/scripts/telegram_notify.py failure \
            --commit "${{ github.sha }}" \
            --repo "${{ github.repository }}" \
            --server-url "${{ github.server_url }}" \
            --run-id "${{ github.run_id }}" \
            --actor "${{ github.actor }}"

  deploy_play_store:
    name: Deploy AAB to Google Play (Internal Testing)
    needs: build_and_notify
    runs-on: ubuntu-latest
    if: needs.build_and_notify.outputs.has_play_credentials == 'true' && github.ref == 'refs/heads/main'
    env:
      GOOGLE_PLAY_SERVICE_ACCOUNT_JSON: ${{ secrets.GOOGLE_PLAY_SERVICE_ACCOUNT_JSON }}

    steps:
      - name: Download Build Artifacts
        if: ${{ env.GOOGLE_PLAY_SERVICE_ACCOUNT_JSON != '' }}
        uses: actions/download-artifact@v4
        with:
          name: how-predur-v${{ needs.build_and_notify.outputs.version_code }}-apks
          path: artifacts

      - name: Upload AAB to Google Play Console (Internal Testing)
        id: play_upload
        if: ${{ env.GOOGLE_PLAY_SERVICE_ACCOUNT_JSON != '' }}
        continue-on-error: true
        uses: r0adkll/upload-google-play@v1
        with:
          serviceAccountJsonPlainText: ${{ secrets.GOOGLE_PLAY_SERVICE_ACCOUNT_JSON }}
          packageName: com.gustlarsen.howpredictable
          releaseFiles: artifacts/bundle/release/${{ needs.build_and_notify.outputs.aab_name }}
          tracks: internal
          status: completed
          inAppUpdatePriority: 2

      - name: Notify Telegram - Play Store Internal Testing
        if: steps.play_upload.outcome == 'success'
        run: |
          if [ -z "${{ secrets.TELEGRAM_BOT_TOKEN }}" ] || [ -z "${{ secrets.TELEGRAM_CHAT_ID }}" ]; then
            echo "TELEGRAM_BOT_TOKEN or TELEGRAM_CHAT_ID is not configured. Skipping Telegram notification."
            exit 0
          fi
          VERSION_NAME="${{ needs.build_and_notify.outputs.version_name }}"
          VERSION_CODE="${{ needs.build_and_notify.outputs.version_code }}"
          PLAY_STORE_URL="https://play.google.com/store/apps/details?id=com.gustlarsen.howpredictable"
          MESSAGE=$(printf '%s\n' \
            "🚀 <b>New Internal Testing Build Live on Google Play!</b>" \
            "" \
            "📱 <b>App:</b> How Predictable You Are" \
            "🏷️ <b>Version:</b> <code>v${VERSION_NAME}</code> (Build <code>${VERSION_CODE}</code>)" \
            "🧪 <b>Track:</b> Internal Testing (<code>internal</code>)" \
            "" \
            "The new Internal Testing build is now live on Google Play Store." \
            "🔗 ${PLAY_STORE_URL}")
          curl -sS --fail-with-body -X POST "https://api.telegram.org/bot${{ secrets.TELEGRAM_BOT_TOKEN }}/sendMessage" \
            -d chat_id="${{ secrets.TELEGRAM_CHAT_ID }}" \
            -d "parse_mode=HTML" \
            --data-urlencode "text=${MESSAGE}"
